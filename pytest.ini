[pytest]
pythonpath = . dags
# Scoped to the pipeline's own tests only. portfolio/dashboard/ is a
# separate deployable app with its own tests/ package (also named "tests")
# — without this, a bare `pytest` from this directory collides on that
# duplicate package name. Run dashboard tests from portfolio/dashboard/
# instead (its own pytest.ini scopes the same way, in reverse).
testpaths = tests
