version: 2

sources:
  - name: sp500
    description: "SP500 stock data landed in BigQuery by the Airflow ingestion pipeline"
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: "{{ env_var('GCP_BQ_DATASET', 'SP_500_DATA') }}"
    tables:
      - name: SP_500_DATA_table
        description: "Cleaned daily OHLCV stock data for all S&P 500 tickers"
        columns:
          - name: symbol
            description: "Stock ticker symbol"
            tests:
              - not_null
          - name: date
            description: "Trading date"
            tests:
              - not_null

models:
  - name: stg_stocks
    description: "Staged, typed daily OHLCV stock data"
    columns:
      - name: symbol
        tests:
          - not_null
      - name: trade_date
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - symbol
            - trade_date

  - name: int_stock_daily_metrics
    description: "Daily price changes, moving averages, Bollinger bands, RSI, and MACD (SMA-approximated) per symbol"

  - name: dim_stock_summary
    description: "Per-symbol summary statistics across the full history"
    columns:
      - name: symbol
        tests:
          - unique
          - not_null

  - name: fct_stock_analysis
    description: "Daily stock analysis with trading signals derived from technical indicators"
