name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Lint (errors only — style/convention findings are non-blocking)
        env:
          PYTHONPATH: dags
        run: |
          pylint --disable=all --enable=E dags tests

      - name: Type-check
        env:
          PYTHONPATH: dags
        run: |
          mypy dags --ignore-missing-imports

      - name: Run tests
        env:
          AIRFLOW_HOME: /tmp/airflow_ci_home
        run: |
          pytest -v

  dashboard-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio/dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: portfolio/dashboard/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run dashboard tests
        run: pytest -v

  dbt-build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install dbt-bigquery

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_CI_PROVIDER }}
          service_account: ${{ vars.WIF_CI_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Create ephemeral CI dataset
        run: |
          CI_DATASET="ci_sp500_${{ github.run_id }}"
          echo "CI_DATASET=${CI_DATASET}" >> "$GITHUB_ENV"
          bq --project_id="${{ vars.GCP_PROJECT_ID }}" mk --dataset \
            --default_table_expiration=3600 \
            "${{ vars.GCP_PROJECT_ID }}:${CI_DATASET}"

      - name: dbt build + test (replaces the old best-effort dbt parse)
        working-directory: dags/dbt/dbt_sp500
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_BQ_DATASET: ${{ env.CI_DATASET }}
          DBT_PROFILES_DIR: .
        run: |
          dbt deps
          dbt build

      - name: Tear down ephemeral CI dataset
        if: always()
        run: |
          bq rm -r -f --dataset "${{ vars.GCP_PROJECT_ID }}:${{ env.CI_DATASET }}"

  changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'

  terraform-plan:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: terraform fmt -check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_CI_PROVIDER }}
          service_account: ${{ vars.WIF_CI_SERVICE_ACCOUNT }}

      - name: terraform init
        working-directory: terraform
        run: terraform init -input=false

      - name: terraform validate
        working-directory: terraform
        run: terraform validate

      - name: terraform plan (read-only — no apply on PRs)
        working-directory: terraform
        run: |
          terraform plan -lock=false -input=false \
            -var="project=${{ vars.GCP_PROJECT_ID }}" \
            -var="alert_notification_email=${{ vars.ALERT_EMAIL }}" \
            -var="github_repo=${{ github.repository }}"
