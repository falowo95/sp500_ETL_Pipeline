name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (errors only — style/convention findings are non-blocking)
        env:
          PYTHONPATH: dags
        run: |
          pylint --disable=all --enable=E dags tests

      - name: Run tests
        env:
          AIRFLOW_HOME: /tmp/airflow_ci_home
        run: |
          pytest -v

      - name: dbt parse (best-effort — no live BigQuery query execution)
        working-directory: dags/dbt/dbt_sp500
        continue-on-error: true
        env:
          GCP_PROJECT_ID: ci-placeholder-project
          GCP_BQ_DATASET: ci_placeholder_dataset
          DBT_PROFILES_DIR: .
        run: |
          dbt deps
          dbt parse
